name: youtube-CI

on:
  push:
    branches:
      - main
      - dev
      - stage

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Capture the short Git SHA as the new image tag BEFORE building,
      # so it can be used in the build-push tags list below.
      - name: Set image tag output
        id: tag
        run: echo "image_tag=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            devictor17/youtube-app:latest
            devictor17/youtube-app:${{ steps.tag.outputs.image_tag }}
          outputs: type=image,push=true

  update-helm-chart:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Helm Charts repository
        uses: actions/checkout@v4
        with:
          repository: Ransomdvictor/youtube-app
          ref: main
          token: ${{ secrets.HELM_REPO_PAT }}

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O yq
          chmod +x yq
          sudo mv yq /usr/local/bin/

    - name: Update Helm values
  env:
    NEW_TAG: ${{ needs.docker.outputs.image_tag }}
    CHART_VALUES_FILE: charts/youtube/values.yaml
  shell: bash
  run: |
    set -euo pipefail

    if [ ! -f "$CHART_VALUES_FILE" ]; then
      echo "ERROR: Helm values file not found:"
      echo "$CHART_VALUES_FILE"
      echo ""
      echo "Available values.yaml files:"
      find . -type f -name "values.yaml" -not -path "./.git/*" -print
      exit 1
    fi

    echo "Updating $CHART_VALUES_FILE"
    echo "New image tag: $NEW_TAG"

    yq -i '.image.tag = strenv(NEW_TAG)' "$CHART_VALUES_FILE"

    git config user.name "github-actions"
    git config user.email "actions@github.com"

    git add "$CHART_VALUES_FILE"

    if git diff --cached --quiet; then
      echo "No chart change detected. Skipping commit."
      exit 0
    fi

    git commit -m "Update image tag to $NEW_TAG"
    git push 
    
