name: youtube-CI

on:
  push:
    branches:
      - main
      - dev
      - stage

jobs:
  docker:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag output
        id: tag
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $IMAGE_TAG"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            devictor17/youtube-app:latest
            devictor17/youtube-app:${{ steps.tag.outputs.image_tag }}

  update-helm-chart:
    needs: docker
    runs-on: ubuntu-latest

    # Only update Helm when code is pushed to main
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Helm Charts repository
        uses: actions/checkout@v4
        with:
          repository: Ransomdvictor/youtube-app
          ref: main
          token: ${{ secrets.HELM_REPO_PAT }}

      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail

          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O yq

          chmod +x yq
          sudo mv yq /usr/local/bin/yq

          yq --version

      - name: Update Helm values
        env:
          NEW_TAG: ${{ needs.docker.outputs.image_tag }}
          CHART_VALUES_FILE: charts/youtube/values.yaml
        shell: bash
        run: |
          set -euo pipefail

          echo "New image tag: $NEW_TAG"
          echo "Helm values file: $CHART_VALUES_FILE"

          if [ ! -f "$CHART_VALUES_FILE" ]; then
            echo "ERROR: Helm values file not found:"
            echo "$CHART_VALUES_FILE"

            echo ""
            echo "Available values.yaml files:"
            find . \
              -type f \
              -name "values.yaml" \
              -not -path "./.git/*" \
              -print

            exit 1
          fi

          echo ""
          echo "Current image configuration:"
          yq '.image' "$CHART_VALUES_FILE"

          echo ""
          echo "Updating image tag..."

          yq -i '.image.tag = strenv(NEW_TAG)' "$CHART_VALUES_FILE"

          echo ""
          echo "Updated image configuration:"
          yq '.image' "$CHART_VALUES_FILE"

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add "$CHART_VALUES_FILE"

          if git diff --cached --quiet; then
            echo "No chart change detected. Skipping commit."
            exit 0
          fi

          git commit -m "Update image tag to $NEW_TAG"
          git push
