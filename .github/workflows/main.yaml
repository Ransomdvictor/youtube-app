name: youtube-CI

on:
  push:
    branches:
      - main
      - dev
      - stage

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Capture the short Git SHA as the new image tag BEFORE building,
      # so it can be used in the build-push tags list below.
      - name: Set image tag output
        id: tag
        run: echo "image_tag=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            devictor17/youtube-app:latest
            devictor17/youtube-app:${{ steps.tag.outputs.image_tag }}
          outputs: type=image,push=true

  update-helm-chart:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Helm Charts repository
        uses: actions/checkout@v4
        with:
          repository: Ransomdvictor/youtube-app
          ref: main
          token: ${{ secrets.HELM_REPO_PAT }}

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O yq
          chmod +x yq
          sudo mv yq /usr/local/bin/

      - name: Update values.yaml with new image tag
  env:
    NEW_TAG: ${{ needs.docker.outputs.image_tag }}
  shell: bash
  run: |
    set -euo pipefail

    echo "Repository contents:"
    find . -maxdepth 4 -type f | sort

    echo ""
    echo "Searching for Helm values.yaml files..."

    mapfile -t VALUES_FILES < <(
      find . \
        -type f \
        -name "values.yaml" \
        -not -path "./.git/*" \
        -print
    )

    if [ "${#VALUES_FILES[@]}" -eq 0 ]; then
      echo "ERROR: Could not find values.yaml in the chart repository."
      exit 1
    fi

    echo "Found values.yaml files:"
    printf '%s\n' "${VALUES_FILES[@]}"

    if [ "${#VALUES_FILES[@]}" -gt 1 ]; then
      echo ""
      echo "ERROR: Multiple values.yaml files found."
      echo "Please configure the exact Helm chart path."
      exit 1
    fi

    CHART_VALUES_FILE="${VALUES_FILES[0]}"

    echo ""
    echo "Using Helm values file:"
    echo "$CHART_VALUES_FILE"

    echo ""
    echo "Current image configuration:"
    yq '.image' "$CHART_VALUES_FILE"

    yq -i '.image.tag = strenv(NEW_TAG)' "$CHART_VALUES_FILE"

    echo ""
    echo "Updated image configuration:"
    yq '.image' "$CHART_VALUES_FILE"

    git config user.name "github-actions"
    git config user.email "actions@github.com"

    git add "$CHART_VALUES_FILE"

    if git diff --cached --quiet; then
      echo "No chart change detected. Skipping commit."
      exit 0
    fi

    git commit -m "Update image tag to $NEW_TAG"
    git push
